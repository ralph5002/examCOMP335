<html>
<head>
  <title>Change Password</title>
  <link rel="stylesheet" href="/stylesheets/style.css">
</head>

<body>
  <div id="message"></div>
  <h2>Please type your new password</h2>

  <form method="post" action="/exam/changePassword">
    <div style="float:left; width: 250px;">Current password</div>
      <input type="password" name="current" placeholder="Current Password"><br>
    <div style="float:left; width: 250px;">New Password</div>
      <input type="password" name="newPassword" placeholder="Password"><br>
    <div style="float:left; width: 250px;">New Password one more time</div>
      <input type="password" name="confirm" placeholder="Password confirmation"><br>
    <br><div style="float:left; width: 250px;">&nbsp;</div>
      <input type="submit" value="Change Password">
  </form>

  <br><a href="/exam/notAdmin">Back to my assignments</a><br>
  <a href="/exam/logout">Log out</a><br>

  <script>
    const msg = new URLSearchParams(window.location.search).get("message");
    if (msg) document.getElementById("message").innerText = msg;
  </script>
</body>
</html>
